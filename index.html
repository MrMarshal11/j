<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>💝 For You</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="bg"></canvas>

    <main class="wrap">
      <section class="card" aria-label="Valentine card">
        <div class="badge">💌</div>
        <h1 class="title">For you</h1>

        <div class="message">
          <div class="typewriter" id="typewriter" aria-live="polite"></div>
          <div class="cursor" aria-hidden="true"></div>
        </div>

        <div class="controls">
          <button id="surpriseBtn" class="btn">Tap for a surprise 💘</button>
          <button id="replayBtn" class="btn ghost" title="Replay the note">
            Replay ✨
          </button>
        </div>

        <footer class="footer">
          <span id="signature">— from me</span>
        </footer>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
